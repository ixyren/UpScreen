[package]
name = "upscreen"
version = "1.2.0"
description = "UpScreen — Captura de pantalla en Windows con edición, aceleración NVENC/AMF y upscaling Real-ESRGAN"
authors = ["UpScreen"]
edition = "2021"

[lib]
name = "upscreen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
base64 = "0.22"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = "2"
directories = "5"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
